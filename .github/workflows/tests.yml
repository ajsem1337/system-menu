name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Python tests (no transactions or network)
        run: python3 -B -m unittest discover -s tests -v
      - name: Menu, widget and About tests
        working-directory: system-menu
        run: lua5.4 ../tests/test_ui.lua
